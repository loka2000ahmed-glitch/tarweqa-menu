<script>
const MENU_DATA=[

{name:'4 مانجو',price:100,oldPrice:150,emoji:'juice'},
{name:'ساعة بلاي ستيشن',price:30,oldPrice:40,emoji:'spark'}]},
{id:'hot',title:'المشروبات الساخنة',type:'list',items:[
['قهوة',20],['شاي',10],['شاي براد',30],['شاي أخضر',20],['شاي نعناع',20],['شاي ليمون',20],['شاي حليب',30],['ينسون',20],['نعناع',20],['ليمون سخن',20],['كركديه',20],['قرفة سادة',20],['قرفة حليب',25],['زنجبيل',20],['قرفة بالزنجبيل حليب',30],['كوفي ميكس',20],['سحلب',30],['هوت شوكليت',40],['اسبريسو',30],['لاتيه',45],['نسكافيه',40],['قهوة فرنساوي',35],['قهوة بندق',40],['ميكس أعشاب',40]].map(([name,price])=>({name,price}))},
{id:'juice',title:'العصائر',type:'sizes',note:'إضافة فليفر +10 ج',items:[['مانجو',[30,40,50]],['فراولة',[25,35,45]],['جوافة',[25,35,45]],['برتقال',[25,35,45]],['ليمون نعناع',[25,30,40]],['موز بحليب',[30,40,50]],['بطيخ',[30,40,50]],['أفوكادو',[50,70,90]],['عناب',[20,25,30]],['بلح باللبن',[30,40,50]],['آيس كوفي',[30,40,50]]].map(([name,prices])=>({name,prices}))},
{id:'soda',title:'الصودا',type:'list',items:[
{name:'صن شاين',price:50,description:'فليفر رمان - سفن - ليمون'},{name:'سكوتش منت',price:50,description:'فليفر نعناع - سفن - ليمون'},{name:'بلو أوشن',price:50,description:'فليفر بلو - سفن - ليمون'},{name:'موهيتو',price:50,description:'نعناع - ليمون - فليفر موهيتو - سفن'},
{name:'مياه صغيرة',price:10},{name:'بيبسي',price:30},{name:'سفن آب',price:30},{name:'ميرندا',price:30},{name:'شويبس',price:30},{name:'فيروز',price:35},{name:'فولت',price:20},{name:'تويست',price:30},{name:'ريد بول',price:85},{name:'بريل',price:35},{name:'إضافة فليفر',price:10}]},
{id:'smoothies',title:'سموذي وميلك شيك',type:'list',items:[{name:'السموذي',price:50,description:'سعر موحد لجميع الأنواع'},{name:'الميلك شيك',price:55,description:'سعر موحد لجميع الأنواع'}]},
{id:'desserts',title:'حلويات وآيس كريم',type:'list',items:[{name:'أرز بلبن سادة',price:25},{name:'كريم كراميل',price:30},{name:'آيس كريم طبيعي 100%',description:'اسأل الجرسون عن الأسعار'}]},
{id:'food',title:'اندومي',type:'list',items:[{name:'اندومي صغير',price:10},{name:'اندومي كبير',price:15}]},
{id:'winter',title:'ترويقة الشتاء',type:'chips',items:[{name:'بليلة بلبن'},{name:'حمص الشام'},{name:'سحلب'}]}
];
const PLACE_INFO=[['spark','مجهز لأعياد الميلاد وأي مناسبات'],['cup','مجهز لاستقبال أولياء الأمور'],['spark','واي فاي • بلاي ستيشن'],['dessert','ممكن تذاكر أو تشتغل، المكان هادئ جداً']];

const menu=document.getElementById('menu'),tabs=document.getElementById('tabs'),search=document.getElementById('search'),topBtn=document.getElementById('top'),progress=document.getElementById('progress'),searchStatus=document.getElementById('searchStatus'),shareMenu=document.getElementById('shareMenu');
let revealObserver=null,spyObserver=null,scrollTick=false,scrollLockUntil=0,scrollEndTimer=0,programmaticScroll=false;
const reduceMotion=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=v=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function price(v,label='',cls=''){return `<span class="price ${cls}">${label?`<small>${esc(label)}</small>`:''}${esc(v)}</span>`}
function prices(item,type){if(type==='sizes')return item.prices.map((v,i)=>price(v,['صغير','وسط','كبير'][i],['alt','','big'][i])).join('');return typeof item.price==='number'?price(item.price):price('اسأل','','ask')}
function normalizeArabic(v){return String(v).toLocaleLowerCase('ar-EG').normalize('NFKC').replace(/[ًٌٍَُِّْـ]/g,'').replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').trim()}
function match(item,q){if(!q)return true;const hay=normalizeArabic(`${item.name} ${item.description||''}`),tokens=normalizeArabic(q).split(' ').filter(Boolean);return tokens.every(t=>hay.includes(t))}
const ICONS={offers:'tag',hot:'cup',juice:'juice',soda:'spark',smoothies:'shake',desserts:'dessert',food:'noodles',winter:'snow'};
function icon(name){const p={tag:'<path d="M20 13 13 20a2 2 0 0 1-2.8 0L4 13.8V4h9.8L20 10.2a2 2 0 0 1 0 2.8Z"/><circle cx="8.5" cy="8.5" r="1.3"/>',cup:'<path d="M5 8h11v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V8Z"/><path d="M16 10h2a2.5 2.5 0 0 1 0 5h-2M8 4c-1 1 1 2 0 3M12 4c-1 1 1 2 0 3"/>',juice:'<path d="M8 5h8l-1 14H9L8 5Z"/><path d="M7 5h10M10 2h4M12 2v3"/>',spark:'<path d="m12 3 1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3ZM19 16l.7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16Z"/>',shake:'<path d="M7 8h10l-1 12H8L7 8ZM9 5h6l2 3H7l2-3ZM10 2h4"/>',dessert:'<path d="M5 10h14a7 7 0 0 1-14 0ZM7 18h10M9 21h6"/>',noodles:'<path d="M5 12h14M7 12c0 5 2 8 5 8s5-3 5-8M8 8c1-3 2-4 3-5M13 8c1-3 2-4 3-5"/>',snow:'<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M7 5l5 7 5-7M7 19l5-7 5 7"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p[name]||p.spark}</svg>`}
function heading(s){return `<div class="section-title"><h2><span class="section-icon">${icon(ICONS[s.id])}</span>${esc(s.title)}</h2>${s.type==='sizes'?'<span>صغير • وسط • كبير</span>':''}</div>`}
function render(q=''){
 const visible=MENU_DATA.map(s=>({...s,items:s.items.filter(i=>match(i,q))})).filter(s=>s.items.length);
 if(!visible.length){menu.innerHTML='<div class="empty card no-results" role="status"><div><strong>مفيش صنف مطابق</strong><span>جرب كلمة تانية أو امسح البحث.</span><br><button class="clear-search" type="button" id="clearSearchEmpty">مسح البحث</button></div></div>';setupObservers();document.getElementById('clearSearchEmpty')?.addEventListener('click',()=>{search.value='';updateSearchUI();render('');search.focus()});if(searchStatus)searchStatus.textContent='0 نتيجة';return}
 const query=q.trim();
 const resultCount=visible.reduce((n,s)=>n+s.items.length,0);
 if(searchStatus) searchStatus.textContent=query?`${resultCount} ${resultCount===1?'نتيجة':'نتيجة'}`:'';
 menu.innerHTML=`<div class="welcome"><div><h2>منيو ترويقة</h2><p>${query?`نتائج البحث عن «${esc(query)}»`:'اختار قسمك وابدأ الروقان'}</p></div><span class="badge">الأسعار بالجنيه</span></div>`+
 visible.map(s=>{
  if(s.type==='offers')return `<section id="${s.id}" class="section" aria-labelledby="heading-${s.id}"><div>${heading(s).replace('<h2>','<h2 id="heading-'+s.id+'">')}</div><p style="margin:0 2px 9px;color:var(--muted);font-size:11px">${esc(s.note)}</p><div class="offers">${s.items.map(i=>`<article class="offer"><div class="emoji">${icon(i.emoji)}</div><div class="offer-name">${esc(i.name)}</div><div class="offer-price">${esc(i.price)} ج</div><div class="offer-old">بدلاً من ${esc(i.oldPrice)} ج</div></article>`).join('')}</div></section>`;
  if(s.type==='chips')return `<section id="${s.id}" class="section" aria-labelledby="heading-${s.id}"><div>${heading(s).replace('<h2>','<h2 id="heading-'+s.id+'">')}</div><div class="card chips">${s.items.map(i=>`<span class="chip">${esc(i.name)}</span>`).join('')}</div></section>`;
  return `<section id="${s.id}" class="section" aria-labelledby="heading-${s.id}"><div>${heading(s).replace('<h2>','<h2 id="heading-'+s.id+'">')}</div>${s.note?`<p style="margin:0 2px 8px;color:var(--muted);font-size:11px">${esc(s.note)}</p>`:''}<div class="card">${s.items.map(i=>`<article class="row"><div class="name">${esc(i.name)}${i.description?`<span class="desc">${esc(i.description)}</span>`:''}</div><div class="prices">${prices(i,s.type)}</div></article>`).join('')}</div></section>`;
 }).join('')+(!query?`<section class="section" aria-labelledby="heading-place"><div class="section-title"><h2 id="heading-place"><span class="section-icon">${icon('spark')}</span>عن المكان</h2></div><div class="place">${PLACE_INFO.map(x=>`<div><span>${icon(x[0])}</span>${esc(x[1])}</div>`).join('')}</div></section>`:'');
 setupObservers();setupTilt();setupRipples();
}
function setActiveTab(id){if(!id)return;const b=tabs.querySelector(`[data-id="${id}"]`);if(!b)return;const active=tabs.querySelector('.tab[aria-current="true"]');if(active===b)return;tabs.querySelectorAll('.tab').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','true');if(!search.value){const left=b.offsetLeft-(tabs.clientWidth-b.offsetWidth)/2;tabs.scrollTo({left:Math.max(0,left),behavior:reduceMotion()?'auto':'smooth'})}}
function updateActiveSection(){if(search.value||programmaticScroll||Date.now()<scrollLockUntil)return;const sections=[...document.querySelectorAll('.section[id]')];if(!sections.length)return;const nav=document.querySelector('.nav');const marker=(nav?.getBoundingClientRect().bottom||0)+28;let current=sections[0];for(const section of sections){if(section.getBoundingClientRect().top<=marker)current=section;else break}setActiveTab(current.id)}
function setupObservers(){if(revealObserver)revealObserver.disconnect();if(spyObserver)spyObserver.disconnect();const sections=[...document.querySelectorAll('.section')];if(!sections.length)return;if(!('IntersectionObserver' in window)||reduceMotion()){sections.forEach(s=>s.classList.add('is-visible'));return}revealObserver=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-visible');revealObserver.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px',threshold:.06});sections.forEach((s,i)=>{s.style.animationDelay=`${Math.min(i*45,240)}ms`;revealObserver.observe(s)});updateActiveSection()}
function setupTilt(){if(reduceMotion()||!window.matchMedia('(hover:hover)').matches)return;document.querySelectorAll('.offer:not([data-tilt-bound])').forEach(card=>{card.dataset.tiltBound='1';card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`perspective(900px) rotateY(${x*1.8}deg) rotateX(${-y*1.8}deg) translateY(-4px)`});card.addEventListener('pointerleave',()=>card.style.transform='')})}
function setupRipples(){if(reduceMotion())return;document.querySelectorAll('.tab:not([data-ripple-bound]),.chip:not([data-ripple-bound]),.offer:not([data-ripple-bound])').forEach(el=>{el.dataset.rippleBound='1';el.addEventListener('pointerdown',e=>{const r=el.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement('span');s.className='ripple';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;el.appendChild(s);s.addEventListener('animationend',()=>s.remove(),{once:true})})})}
function finishProgrammaticScroll(){programmaticScroll=false;scrollLockUntil=0;clearTimeout(scrollEndTimer);scrollEndTimer=0;updateActiveSection()}
function scrollToSection(target){if(!target)return;const nav=document.querySelector('.nav');const offset=(nav?.getBoundingClientRect().height||0)+10;const top=Math.max(0,window.scrollY+target.getBoundingClientRect().top-offset);programmaticScroll=true;scrollLockUntil=Date.now()+1400;clearTimeout(scrollEndTimer);window.scrollTo({top,behavior:reduceMotion()?'auto':'smooth'});scrollEndTimer=setTimeout(finishProgrammaticScroll,1050)}
function renderTabs(){tabs.innerHTML=MENU_DATA.map((s,i)=>`<button type="button" class="tab" aria-controls="${s.id}" data-id="${s.id}"${i===0?' aria-current="true"':''}><span class="tab-icon">${icon(ICONS[s.id])}</span><span>${esc(s.title)}</span><span class="tab-count" aria-hidden="true">${s.items.length}</span></button>`).join('');tabs.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{if(search.value){search.value='';searchClear.hidden=true;render('')}const target=document.getElementById(b.dataset.id);if(!target)return;scrollToSection(target);tabs.querySelectorAll('.tab').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','true');try{history.replaceState(null,'','#'+encodeURIComponent(b.dataset.id))}catch(e){}}))}
const searchClear=document.getElementById('searchClear');let searchTimer;function updateSearchUI(){searchClear.hidden=!search.value.trim()}search.addEventListener('input',()=>{updateSearchUI();clearTimeout(searchTimer);searchTimer=setTimeout(()=>render(search.value.trim()),80)});searchClear.addEventListener('click',()=>{search.value='';updateSearchUI();render('');search.focus()});search.addEventListener('keydown',e=>{if(e.key==='Escape'&&search.value){search.value='';updateSearchUI();render('')}});
window.addEventListener('scroll',()=>{if(scrollTick)return;scrollTick=true;requestAnimationFrame(()=>{topBtn.classList.toggle('show',scrollY>500);const max=document.documentElement.scrollHeight-innerHeight;progress.style.width=Math.min(100,Math.max(0,max>0?(scrollY/max)*100:0))+'%';updateActiveSection();scrollTick=false})},{passive:true});
if('onscrollend' in window)window.addEventListener('scrollend',()=>{if(programmaticScroll)finishProgrammaticScroll()},{passive:true});
window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.replace(/^#/,''));const target=document.getElementById(id);if(target){scrollToSection(target);setActiveTab(id)}});
topBtn.addEventListener('click',()=>scrollTo({top:0,behavior:reduceMotion()?'auto':'smooth'}));
async function copyLink(text){
 try{
  if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}
 }catch(e){}
 try{
  const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';area.style.pointerEvents='none';document.body.appendChild(area);area.select();area.setSelectionRange(0,area.value.length);const ok=document.execCommand('copy');area.remove();return ok;
 }catch(e){return false}
}
async function shareMenuPage(){
 const shareData={title:'ترويقة كافيه | المنيو',text:'ترويقة أصل الروقان — منيو ترويقة كافيه',url:location.href};
 try{
  if(navigator.share){await navigator.share(shareData);return}
 }catch(e){if(e&&e.name==='AbortError')return}
 if(await copyLink(location.href))showToast('تم نسخ رابط المنيو');else showToast('انسخ رابط المنيو من شريط المتصفح');
}
function showToast(message){let t=document.getElementById('copyToast');if(!t){t=document.createElement('div');t.id='copyToast';t.className='copy-toast';t.setAttribute('role','status');t.setAttribute('aria-live','polite');document.body.appendChild(t)}t.textContent=message;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),1800)}
shareMenu?.addEventListener('click',shareMenuPage);
renderTabs();render();
const initialSection=decodeURIComponent(location.hash.replace(/^#/,'')).trim();
if(initialSection&&document.getElementById(initialSection)){requestAnimationFrame(()=>{scrollToSection(document.getElementById(initialSection));setActiveTab(initialSection)})}
</script>
